<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f7f5f1">
<title>まんが本棚</title>
<style>
:root{--bg:#f7f5f1;--card:#fff;--ink:#282722;--muted:#77756e;--line:#e6e2da;--accent:#5c6954;--accent-soft:#e7ece3;--orange:#a96a27;--orange-soft:#fff0db;--red:#a64f4f;--shadow:0 4px 16px #29251a0a}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN","Yu Gothic",Meiryo,sans-serif;font-size:15px;line-height:1.5}button,input,select,textarea{font:inherit}button{cursor:pointer}button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #b6c5a8;outline-offset:2px}
.app{max-width:760px;margin:auto;min-height:100dvh;padding-bottom:calc(88px + env(safe-area-inset-bottom))}.top{padding:22px 18px 12px;position:sticky;top:0;z-index:5;background:#f7f5f1ed;backdrop-filter:blur(12px)}.brandrow{display:flex;align-items:center;justify-content:space-between;gap:12px}.brand{font-weight:800;font-size:24px;letter-spacing:.02em}.brand small{font-size:12px;color:var(--muted);font-weight:500;display:block;letter-spacing:.06em}.iconbtn{border:1px solid var(--line);background:var(--card);border-radius:13px;width:42px;height:42px;font-size:18px}.page{display:none;padding:8px 16px 20px}.page.active{display:block}.sectionhead{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:12px 2px 14px}.sectionhead h1{font-size:21px;margin:0}.muted{color:var(--muted)}.small{font-size:12px}.search{width:100%;padding:13px 15px;border:1px solid var(--line);background:#fff;border-radius:14px;margin:6px 0 12px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin:10px 0 18px}.stat{padding:13px;background:var(--card);border:1px solid var(--line);border-radius:16px}.stat b{display:block;font-size:22px}.stat span{font-size:12px;color:var(--muted)}.chips{display:flex;gap:7px;overflow-x:auto;padding:2px 0 10px}.chip{white-space:nowrap;border:1px solid var(--line);border-radius:999px;padding:8px 12px;background:#fff;color:var(--muted);font-size:13px}.chip.active{background:var(--accent-soft);border-color:#c9d4c1;color:var(--accent);font-weight:700}.booklist{display:grid;gap:10px}.bookcard{background:var(--card);border:1px solid var(--line);border-radius:17px;padding:15px;box-shadow:var(--shadow);display:flex;align-items:flex-start;gap:12px}.bookicon{width:44px;height:52px;border-radius:8px;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font-size:21px;flex-shrink:0}.bookmain{flex:1;min-width:0}.booktitle{font-weight:750;font-size:16px;overflow-wrap:anywhere}.bookmeta{font-size:12px;color:var(--muted);margin-top:4px}.tagrow{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}.tag{font-size:11px;padding:4px 8px;border-radius:999px;background:#f0eee9;color:#666}.tag.good{background:var(--accent-soft);color:var(--accent)}.tag.warn{background:var(--orange-soft);color:var(--orange)}.arrow{color:#a5a198;font-size:22px;align-self:center}.primary,.secondary,.danger{border:0;border-radius:13px;padding:12px 15px;font-weight:700}.primary{background:var(--accent);color:white}.secondary{background:var(--accent-soft);color:var(--accent)}.danger{background:#f8e9e7;color:var(--red)}.full{width:100%}.empty{padding:35px 18px;text-align:center;color:var(--muted);background:#fff;border:1px dashed var(--line);border-radius:16px}.empty .emoji{font-size:30px;margin-bottom:6px}.bottomnav{position:fixed;bottom:0;left:0;right:0;z-index:10;background:#fffefbf2;backdrop-filter:blur(15px);border-top:1px solid var(--line);padding:8px 6px calc(8px + env(safe-area-inset-bottom));display:grid;grid-template-columns:repeat(4,1fr);max-width:760px;margin:auto}.navbtn{border:0;background:transparent;color:#89867e;padding:5px 2px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px}.navbtn .navicon{font-size:20px;line-height:1.2}.navbtn.active{color:var(--accent);font-weight:800}.navbtn.active .navicon{background:var(--accent-soft);border-radius:10px;padding:4px 12px}
.modalback{position:fixed;inset:0;background:#201f1ccc;z-index:30;display:none;align-items:flex-end;justify-content:center}.modalback.show{display:flex}.modal{background:var(--bg);width:100%;max-width:760px;max-height:92dvh;overflow:auto;border-radius:22px 22px 0 0;padding:20px 17px calc(24px + env(safe-area-inset-bottom))}.modalhead{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:16px}.modalhead h2{font-size:20px;margin:0}.close{border:0;background:#eae7e0;border-radius:50%;width:36px;height:36px;font-size:20px}.field{margin:13px 0}.field label{display:block;font-size:13px;font-weight:700;margin-bottom:6px}.field input,.field select,.field textarea{width:100%;border:1px solid var(--line);background:#fff;border-radius:12px;padding:12px;color:var(--ink)}.row{display:flex;gap:9px}.row>*{flex:1;min-width:0}.seg{display:flex;background:#eae7e0;border-radius:12px;padding:4px;gap:4px}.seg button{flex:1;border:0;background:transparent;border-radius:9px;padding:9px 6px;color:var(--muted)}.seg button.active{background:#fff;color:var(--accent);font-weight:800;box-shadow:0 1px 4px #0000000b}.volumegrid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px;margin:13px 0}.volbtn{border:1px solid var(--line);border-radius:12px;background:#fff;padding:10px 3px;min-height:65px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;color:var(--muted)}.volbtn.owned{background:var(--accent-soft);border-color:#d0dac8;color:var(--accent)}.volbtn.planned{background:var(--orange-soft);border-color:#f1d9b8;color:var(--orange)}.volbtn b{font-size:14px}.volbtn span{font-size:10px}.formnote{font-size:12px;color:var(--muted);margin-top:5px}.inlinecheck{display:flex;align-items:center;gap:8px}.inlinecheck input{width:auto}.itemrow{background:#fff;border:1px solid var(--line);border-radius:15px;padding:13px;margin-bottom:9px;display:flex;gap:10px;align-items:center}.itemrow .itemtext{flex:1;min-width:0}.itemrow b{display:block;overflow-wrap:anywhere}.itemrow .sub{font-size:12px;color:var(--muted);margin-top:3px}.tinybtn{border:1px solid var(--line);background:#fff;border-radius:10px;padding:8px 10px;font-size:12px;font-weight:700}.tinybtn.green{background:var(--accent-soft);border-color:transparent;color:var(--accent)}.tinybtn.orange{background:var(--orange-soft);border-color:transparent;color:var(--orange)}.divider{height:1px;background:var(--line);margin:17px 0}.footerhint{font-size:12px;color:var(--muted);line-height:1.6;margin-top:14px}
@media(min-width:600px){.page{padding-left:22px;padding-right:22px}.top{padding-left:24px;padding-right:24px}.modal{border-radius:22px;margin-bottom:20px}.modalback{align-items:center;padding:20px}.volumegrid{grid-template-columns:repeat(7,minmax(0,1fr))}}
</style>
</head>
<body>
<div class="app">
<header class="top"><div class="brandrow"><div class="brand">📚 まんが本棚<small>所持巻数・新刊・買い物リスト</small></div><button class="iconbtn" aria-label="データ管理" onclick="openBackup()">⚙</button></div></header>
<main>
<section class="page active" id="page-shelf">
 <div class="sectionhead"><h1>本棚</h1><button class="primary" onclick="openBookForm()">＋ 作品登録</button></div>
 <div class="stats"><div class="stat"><b id="statTitles">0</b><span>登録作品</span></div><div class="stat"><b id="statOwned">0</b><span>所持巻数※</span></div><div class="stat"><b id="statPlans">0</b><span>購入予定</span></div></div>
 <input class="search" id="searchInput" placeholder="🔎 作品名で検索" oninput="renderShelf()">
 <div class="chips" id="shelfFilters"><button class="chip active" data-filter="all" onclick="setFilter('all')">すべて</button><button class="chip" data-filter="gaps" onclick="setFilter('gaps')">抜け巻あり</button><button class="chip" data-filter="plans" onclick="setFilter('plans')">購入予定あり</button><button class="chip" data-filter="ongoing" onclick="setFilter('ongoing')">連載中</button><button class="chip" data-filter="complete" onclick="setFilter('complete')">完結</button></div>
 <div class="booklist" id="bookList"></div><p class="footerhint">※所持巻数は紙・電子それぞれの所持巻数の合計です。同じ巻を紙と電子の両方で持っている場合は2冊として数えます。</p>
</section>
<section class="page" id="page-new">
 <div class="sectionhead"><div><h1>新刊チェック</h1><div class="muted small">発売予定を確認して、欲しい巻だけ追加</div></div><button class="primary" onclick="openReleaseForm()">＋ 新刊登録</button></div>
 <div class="chips"><button class="chip active" id="releaseAllChip" onclick="setReleaseFilter('all')">すべて</button><button class="chip" id="releaseUpcomingChip" onclick="setReleaseFilter('upcoming')">発売予定</button><button class="chip" id="releaseUnknownChip" onclick="setReleaseFilter('unknown')">発売日未定</button><button class="chip" id="releaseOutChip" onclick="setReleaseFilter('out')">発売済み</button></div>
 <div id="releaseList"></div><p class="footerhint">発売日は手動で登録する方式です。新刊情報の自動取得はまだ対応していません。</p>
</section>
<section class="page" id="page-plans">
 <div class="sectionhead"><div><h1>購入予定</h1><div class="muted small">買うものだけをまとめて確認</div></div></div>
 <div class="chips"><button class="chip active" id="planAllChip" onclick="setPlanFilter('all')">すべて</button><button class="chip" id="planPaperChip" onclick="setPlanFilter('paper')">紙</button><button class="chip" id="planEbookChip" onclick="setPlanFilter('ebook')">電子</button></div>
 <div id="planList"></div>
</section>
<section class="page" id="page-history">
 <div class="sectionhead"><div><h1>購入履歴</h1><div class="muted small">購入済みにした巻を記録</div></div><button class="secondary" onclick="exportData()">バックアップ</button></div>
 <div id="historyList"></div>
</section>
</main>
<nav class="bottomnav" aria-label="メインメニュー">
 <button class="navbtn active" data-page="shelf" onclick="goPage('shelf')"><span class="navicon">▤</span>本棚</button>
 <button class="navbtn" data-page="new" onclick="goPage('new')"><span class="navicon">◷</span>新刊チェック</button>
 <button class="navbtn" data-page="plans" onclick="goPage('plans')"><span class="navicon">🛒</span>購入予定<span id="navPlanCount"></span></button>
 <button class="navbtn" data-page="history" onclick="goPage('history')"><span class="navicon">↺</span>購入履歴</button>
</nav>
</div>
<div class="modalback" id="modalBack" onclick="if(event.target===this)closeModal()"><div class="modal" id="modalContent"></div></div>
<input type="file" id="importFile" accept="application/json,.json" hidden onchange="importData(event)">
<script>
const KEY='mangaShelfApp_v1';
let state={books:[],releases:[],plans:[],history:[]};
let shelfFilter='all',releaseFilter='all',planFilter='all',detailId=null,detailFormat='paper';
function uid(){return 'id'+Date.now().toString(36)+Math.random().toString(36).slice(2,8)}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function load(){try{const raw=localStorage.getItem(KEY);if(raw){const x=JSON.parse(raw);state={books:x.books||[],releases:x.releases||[],plans:x.plans||[],history:x.history||[]}}}catch(e){alert('保存データを読み込めませんでした。バックアップから復元してください。')}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(state))}catch(e){alert('保存容量が不足している可能性があります。バックアップを取り、データを整理してください。')}renderAll()}
function goPage(p){document.querySelectorAll('.page').forEach(x=>x.classList.toggle('active',x.id==='page-'+p));document.querySelectorAll('.navbtn').forEach(x=>x.classList.toggle('active',x.dataset.page===p));if(p==='shelf')renderShelf();if(p==='new')renderReleases();if(p==='plans')renderPlans();if(p==='history')renderHistory();window.scrollTo({top:0,behavior:'smooth'})}
function openModal(html){document.getElementById('modalContent').innerHTML=html;document.getElementById('modalBack').classList.add('show');document.body.style.overflow='hidden'}
function closeModal(){document.getElementById('modalBack').classList.remove('show');document.body.style.overflow=''}
function bookById(id){return state.books.find(b=>b.id===id)}
function volStatus(b,fmt,n){return (b.volumes?.[fmt]||{})[n]||'missing'}
function countOwned(b,fmt){return Object.values(b.volumes?.[fmt]||{}).filter(s=>s==='owned').length}
function missingNums(b,fmt){const nums=Object.keys(b.volumes?.[fmt]||{}).map(Number).filter(n=>Number.isFinite(n)&&n>0);if(!nums.length)return [];const max=Math.max(...nums);let out=[];for(let n=1;n<=max;n++)if(volStatus(b,fmt,n)!=='owned')out.push(n);return out}
function planCount(bid,fmt){return state.plans.filter(p=>p.bookId===bid&&(!fmt||p.format===fmt)).length}
function formatName(f){return f==='paper'?'紙':'電子'}
function statusName(s){return s==='owned'?'所持':s==='planned'?'購入予定':'未所持'}
function nextVol(b,fmt){let nums=Object.keys(b.volumes?.[fmt]||{}).map(Number).filter(n=>n>0);let max=Math.max(0,...nums);for(let n=1;n<=max+1;n++)if(volStatus(b,fmt,n)!=='owned')return n;return max+1}
function renderAll(){renderShelf();renderReleases();renderPlans();renderHistory();document.getElementById('navPlanCount').textContent=state.plans.length?' '+state.plans.length:'';document.getElementById('statTitles').textContent=state.books.length;document.getElementById('statOwned').textContent=state.books.reduce((sum,b)=>sum+countOwned(b,'paper')+countOwned(b,'ebook'),0);document.getElementById('statPlans').textContent=state.plans.length}
function setFilter(f){shelfFilter=f;document.querySelectorAll('#shelfFilters .chip').forEach(x=>x.classList.toggle('active',x.dataset.filter===f));renderShelf()}
function renderShelf(){const q=(document.getElementById('searchInput')?.value||'').trim().toLowerCase();let books=state.books.filter(b=>b.title.toLowerCase().includes(q));books=books.filter(b=>shelfFilter==='all'||(shelfFilter==='gaps'&&(missingNums(b,'paper').length||missingNums(b,'ebook').length))||(shelfFilter==='plans'&&planCount(b.id))||(shelfFilter==='ongoing'&&b.status!=='complete')||(shelfFilter==='complete'&&b.status==='complete'));books.sort((a,b)=>a.title.localeCompare(b.title,'ja'));const el=document.getElementById('bookList');if(!books.length){el.innerHTML=`<div class="empty"><div class="emoji">📚</div><b>${state.books.length?'該当する作品がありません':'本棚はまだ空です'}</b><div class="small" style="margin:7px 0 14px">${state.books.length?'検索条件を変えてみてね':'まずは作品を1つ登録してみよう'}</div>${!state.books.length?'<button class="primary" onclick="openBookForm()">＋ 作品を登録</button>':''}</div>`;return}el.innerHTML=books.map(b=>{let p=countOwned(b,'paper'),e=countOwned(b,'ebook'),gap=[...missingNums(b,'paper')].length+[...missingNums(b,'ebook')].length;return `<div class="bookcard" onclick="openDetail('${b.id}')"><div class="bookicon">冊</div><div class="bookmain"><div class="booktitle">${esc(b.title)}</div><div class="bookmeta">${esc(b.author||'作者未登録')} · ${b.status==='complete'?'完結':'連載中／続刊待ち'}</div><div class="tagrow"><span class="tag good">紙 ${p}冊</span><span class="tag good">電子 ${e}冊</span>${planCount(b.id)?`<span class="tag warn">購入予定 ${planCount(b.id)}件</span>`:''}</div></div><span class="arrow">›</span></div>`}).join('')}
function openBookForm(id){const b=id?bookById(id):null;openModal(`<div class="modalhead"><h2>${b?'作品を編集':'作品を登録'}</h2><button class="close" onclick="closeModal()">×</button></div><form onsubmit="saveBook(event,'${b?.id||''}')"><div class="field"><label>作品名 *</label><input name="title" required maxlength="100" value="${esc(b?.title||'')}" placeholder="作品タイトル"></div><div class="field"><label>作者名（任意）</label><input name="author" maxlength="100" value="${esc(b?.author||'')}" placeholder="作者名"></div><div class="field"><label>作品の状態</label><select name="status"><option value="ongoing" ${b?.status!=='complete'?'selected':''}>連載中・続刊待ち</option><option value="complete" ${b?.status==='complete'?'selected':''}>完結</option></select></div><button class="primary full" type="submit">保存する</button>${b?`<div class="divider"></div><button class="danger full" type="button" onclick="deleteBook('${b.id}')">この作品を削除</button>`:''}</form>`)}
function saveBook(ev,id){ev.preventDefault();const f=new FormData(ev.target);const data={title:f.get('title').trim(),author:f.get('author').trim(),status:f.get('status')};if(id){Object.assign(bookById(id),data)}else state.books.push({id:uid(),...data,volumes:{paper:{},ebook:{}}});save();closeModal()}
function deleteBook(id){if(!confirm('作品と、この作品に関連する購入予定・新刊情報を削除しますか？購入履歴は残ります。'))return;state.books=state.books.filter(b=>b.id!==id);state.plans=state.plans.filter(p=>p.bookId!==id);state.releases=state.releases.filter(r=>r.bookId!==id);save();closeModal()}
function openDetail(id){detailId=id;detailFormat='paper';renderDetail()}
function renderDetail(){const b=bookById(detailId);if(!b){closeModal();return}const fmt=detailFormat;const highest=Math.max(12,...Object.keys(b.volumes?.paper||{}).map(Number),...Object.keys(b.volumes?.ebook||{}).map(Number),...state.plans.filter(p=>p.bookId===b.id).map(p=>p.volume),...state.releases.filter(r=>r.bookId===b.id).map(r=>r.volume));const max=Math.min(Math.max(highest+2,12),300);let grid='';for(let n=1;n<=max;n++){const s=volStatus(b,fmt,n);grid+=`<button class="volbtn ${s}" onclick="cycleVolume('${b.id}','${fmt}',${n})"><b>${n}巻</b><span>${statusName(s)}</span></button>`}openModal(`<div class="modalhead"><div><h2>${esc(b.title)}</h2><div class="muted small">${esc(b.author||'作者未登録')}</div></div><button class="close" onclick="closeModal()">×</button></div><div class="row"><button class="secondary" onclick="openBookForm('${b.id}')">作品情報を編集</button><button class="secondary" onclick="openBulk('${b.id}')">範囲で一括登録</button></div><div class="divider"></div><div class="seg"><button class="${fmt==='paper'?'active':''}" onclick="detailFormat='paper';renderDetail()">📕 紙（${countOwned(b,'paper')}冊）</button><button class="${fmt==='ebook'?'active':''}" onclick="detailFormat='ebook';renderDetail()">📱 電子（${countOwned(b,'ebook')}冊）</button></div><p class="formnote">巻をタップすると「所持 → 未所持 → 購入予定 → 所持」の順に切り替わります。</p><div class="volumegrid">${grid}</div><div class="divider"></div><button class="secondary full" onclick="openReleaseForm('${b.id}')">＋ この作品の新刊予定を登録</button><p class="footerhint">巻数は300巻まで表示できます。登録済み巻数が多い場合は、その巻数まで表示します。</p>`)}
function cycleVolume(id,fmt,n){const b=bookById(id);const old=volStatus(b,fmt,n);const next=old==='owned'?'missing':old==='missing'?'planned':'owned';b.volumes[fmt]=b.volumes[fmt]||{};b.volumes[fmt][n]=next;if(next==='planned'&&!state.plans.some(p=>p.bookId===id&&p.volume===n&&p.format===fmt)){state.plans.push({id:uid(),bookId:id,volume:n,format:fmt,source:'manual',addedAt:new Date().toISOString()})}if(next!=='planned')state.plans=state.plans.filter(p=>!(p.bookId===id&&p.volume===n&&p.format===fmt));if(next==='owned'){state.history.unshift({id:uid(),bookId:id,title:b.title,volume:n,format:fmt,date:new Date().toISOString().slice(0,10),source:'manual'});state.history=state.history.slice(0,1000)}save();renderDetail()}
function openBulk(id){const b=bookById(id);openModal(`<div class="modalhead"><h2>巻数をまとめて登録</h2><button class="close" onclick="closeModal()">×</button></div><p class="muted small">${esc(b.title)} の所持巻数を範囲で登録します。</p><form onsubmit="bulkApply(event,'${id}')"><div class="field"><label>購入形態</label><div class="seg"><button type="button" class="active" id="bulkPaper" onclick="document.getElementById('bulkFormat').value='paper';this.classList.add('active');document.getElementById('bulkEbook').classList.remove('active')">紙</button><button type="button" id="bulkEbook" onclick="document.getElementById('bulkFormat').value='ebook';this.classList.add('active');document.getElementById('bulkPaper').classList.remove('active')">電子</button></div><input type="hidden" name="format" id="bulkFormat" value="paper"></div><div class="row"><div class="field"><label>開始巻</label><input type="number" name="start" min="1" max="300" value="1" required></div><div class="field"><label>終了巻</label><input type="number" name="end" min="1" max="300" value="10" required></div></div><div class="field"><label>登録方法</label><select name="mode"><option value="add">範囲を所持にする（既存の状態は維持）</option><option value="replace">範囲を所持にして、それ以外の巻を未所持にする</option></select></div><button class="primary full" type="submit">範囲を登録</button></form><p class="footerhint">例：開始1、終了10なら1〜10巻を一括登録。個別の巻は後からタップで変更できます。</p>`)}
function bulkApply(ev,id){ev.preventDefault();const f=new FormData(ev.target),fmt=f.get('format'),start=Number(f.get('start')),end=Number(f.get('end')),mode=f.get('mode'),b=bookById(id);if(start<1||end<start||end>300){alert('巻数の範囲を確認してください');return}b.volumes[fmt]=b.volumes[fmt]||{};if(mode==='replace'){Object.keys(b.volumes[fmt]).forEach(n=>{if(Number(n)<start||Number(n)>end)b.volumes[fmt][n]='missing'})}for(let n=start;n<=end;n++){b.volumes[fmt][n]='owned';state.plans=state.plans.filter(p=>!(p.bookId===id&&p.volume===n&&p.format===fmt))}save();renderDetail()}
function setReleaseFilter(f){releaseFilter=f;['all','upcoming','unknown','out'].forEach(k=>document.getElementById('release'+({all:'All',upcoming:'Upcoming',unknown:'Unknown',out:'Out'}[k])+'Chip').classList.toggle('active',k===f));renderReleases()}
function openReleaseForm(bookId=''){const options=state.books.map(b=>`<option value="${b.id}" ${b.id===bookId?'selected':''}>${esc(b.title)}</option>`).join('');if(!options){alert('先に本棚へ作品を登録してください。');return}openModal(`<div class="modalhead"><h2>新刊予定を登録</h2><button class="close" onclick="closeModal()">×</button></div><form onsubmit="saveRelease(event)"><div class="field"><label>作品 *</label><select name="bookId" required>${options}</select></div><div class="row"><div class="field"><label>巻数 *</label><input type="number" name="volume" min="1" max="300" required placeholder="例：13"></div><div class="field"><label>発売日（任意）</label><input type="date" name="date"></div></div><div class="field"><label>発売状況</label><select name="status"><option value="upcoming">発売予定</option><option value="unknown">発売日未定</option><option value="out">発売済み</option></select></div><div class="field"><label>購入形態メモ（任意）</label><select name="format"><option value="paper">紙</option><option value="ebook">電子</option><option value="both">紙・電子どちらも検討</option></select></div><button class="primary full" type="submit">新刊情報を保存</button></form>`)}
function saveRelease(ev){ev.preventDefault();const f=new FormData(ev.target),b=bookById(f.get('bookId')),v=Number(f.get('volume'));if(state.releases.some(r=>r.bookId===b.id&&r.volume===v)){if(!confirm('この作品の巻数はすでに新刊チェックにあります。追加登録しますか？'))return}state.releases.push({id:uid(),bookId:b.id,volume:v,date:f.get('date'),status:f.get('status'),format:f.get('format')});save();closeModal()}
function renderReleases(){let items=state.releases.map(r=>({...r,book:bookById(r.bookId)})).filter(r=>r.book).filter(r=>releaseFilter==='all'||r.status===releaseFilter).sort((a,b)=>(a.date||'9999').localeCompare(b.date||'9999'));const el=document.getElementById('releaseList');if(!items.length){el.innerHTML=`<div class="empty"><div class="emoji">🗓️</div><b>新刊予定はまだありません</b><div class="small" style="margin:7px 0 14px">作品を登録して、発売予定を追加しよう</div>${state.books.length?'<button class="primary" onclick="openReleaseForm()">＋ 新刊予定を登録</button>':''}</div>`;return}el.innerHTML=items.map(r=>`<div class="itemrow"><div class="bookicon">新</div><div class="itemtext"><b>${esc(r.book.title)} ${r.volume}巻</b><div class="sub">${r.date?esc(r.date):'発売日未定'} · ${r.status==='upcoming'?'発売予定':r.status==='unknown'?'発売日未定':'発売済み'} · ${r.format==='both'?'紙・電子':formatName(r.format)}</div></div><button class="tinybtn green" onclick="releaseToPlan('${r.id}')">購入予定へ</button><button class="tinybtn" onclick="deleteRelease('${r.id}')">削除</button></div>`).join('')}
function releaseToPlan(id){const r=state.releases.find(x=>x.id===id),b=bookById(r.bookId);if(!r||!b)return;const fmt=r.format==='both'?'paper':r.format;if(volStatus(b,fmt,r.volume)==='owned'){if(!confirm(`${formatName(fmt)}では所持済みです。購入予定に追加しますか？`))return}if(!state.plans.some(p=>p.bookId===r.bookId&&p.volume===r.volume&&p.format===fmt)){state.plans.push({id:uid(),bookId:r.bookId,volume:r.volume,format:fmt,source:'release',addedAt:new Date().toISOString()})}b.volumes[fmt]=b.volumes[fmt]||{};if(volStatus(b,fmt,r.volume)!=='owned')b.volumes[fmt][r.volume]='planned';save();goPage('plans')}
function deleteRelease(id){state.releases=state.releases.filter(r=>r.id!==id);save()}
function setPlanFilter(f){planFilter=f;['all','paper','ebook'].forEach(k=>document.getElementById('plan'+({all:'All',paper:'Paper',ebook:'Ebook'}[k])+'Chip').classList.toggle('active',k===f));renderPlans()}
function addPlan(bookId,volume,fmt){const b=bookById(bookId);if(!b)return;volume=Number(volume);if(!Number.isInteger(volume)||volume<1||volume>300){alert('巻数は1〜300で入力してください');return}if(volStatus(b,fmt,volume)==='owned'&&!confirm('この巻は所持済みです。購入予定に追加しますか？'))return;if(state.plans.some(p=>p.bookId===bookId&&p.volume===volume&&p.format===fmt)){alert('この巻はすでに購入予定にあります');return}state.plans.push({id:uid(),bookId,volume,format:fmt,source:'manual',addedAt:new Date().toISOString()});b.volumes[fmt]=b.volumes[fmt]||{};if(volStatus(b,fmt,volume)!=='owned')b.volumes[fmt][volume]='planned';save();renderPlans()}
function openAddPlan(){if(!state.books.length){alert('先に本棚へ作品を登録してください');return}const opts=state.books.map(b=>`<option value="${b.id}">${esc(b.title)}</option>`).join('');openModal(`<div class="modalhead"><h2>購入予定を追加</h2><button class="close" onclick="closeModal()">×</button></div><form onsubmit="manualAddPlan(event)"><div class="field"><label>作品</label><select name="bookId">${opts}</select></div><div class="row"><div class="field"><label>巻数</label><input type="number" name="volume" min="1" max="300" required placeholder="例：6"></div><div class="field"><label>購入形態</label><select name="format"><option value="paper">紙</option><option value="ebook">電子</option></select></div></div><button class="primary full">購入予定に追加</button></form>`)}
function manualAddPlan(ev){ev.preventDefault();const f=new FormData(ev.target);const id=f.get('bookId'),v=Number(f.get('volume')),fmt=f.get('format');closeModal();addPlan(id,v,fmt)}
function renderPlans(){let items=state.plans.filter(p=>planFilter==='all'||p.format===planFilter).map(p=>({...p,book:bookById(p.bookId)})).filter(p=>p.book).sort((a,b)=>a.book.title.localeCompare(b.book.title,'ja')||a.volume-b.volume);const el=document.getElementById('planList');if(!items.length){el.innerHTML=`<div class="empty"><div class="emoji">🛒</div><b>購入予定は空です</b><div class="small" style="margin:7px 0 14px">新刊チェックや本棚から、買いたい巻を追加しよう</div>${state.books.length?'<button class="primary" onclick="openAddPlan()">＋ 購入予定を追加</button>':''}</div>`;return}el.innerHTML=`<div class="sectionhead"><span class="muted small">${items.length}件</span><button class="primary" onclick="openAddPlan()">＋ 追加</button></div>`+items.map(p=>`<div class="itemrow"><div class="bookicon">${p.format==='paper'?'📕':'📱'}</div><div class="itemtext"><b>${esc(p.book.title)} ${p.volume}巻</b><div class="sub">${formatName(p.format)} · ${p.source==='release'?'新刊チェックから追加':'手動で追加'}</div></div><button class="tinybtn green" onclick="markPurchased('${p.id}')">購入済み</button><button class="tinybtn" onclick="removePlan('${p.id}')">外す</button></div>`).join('')}
function markPurchased(id){const p=state.plans.find(x=>x.id===id);if(!p)return;const b=bookById(p.bookId);if(!b)return;b.volumes[p.format]=b.volumes[p.format]||{};b.volumes[p.format][p.volume]='owned';state.plans=state.plans.filter(x=>x.id!==id);state.history.unshift({id:uid(),bookId:b.id,title:b.title,volume:p.volume,format:p.format,date:new Date().toISOString().slice(0,10),source:'purchasePlan'});state.history=state.history.slice(0,1000);save()}
function removePlan(id){const p=state.plans.find(x=>x.id===id);state.plans=state.plans.filter(x=>x.id!==id);if(p){const b=bookById(p.bookId);if(b&&volStatus(b,p.format,p.volume)==='planned')b.volumes[p.format][p.volume]='missing'}save()}
function renderHistory(){const items=state.history;const el=document.getElementById('historyList');if(!items.length){el.innerHTML='<div class="empty"><div class="emoji">🧾</div><b>購入履歴はまだありません</b><div class="small" style="margin-top:7px">購入予定から「購入済み」を押すと、ここに記録されます。</div></div>';return}el.innerHTML=items.map(h=>`<div class="itemrow"><div class="bookicon">✓</div><div class="itemtext"><b>${esc(h.title||bookById(h.bookId)?.title||'削除済み作品')} ${h.volume}巻</b><div class="sub">${formatName(h.format)} · ${esc(h.date||'日付未登録')}</div></div></div>`).join('')}
function openBackup(){openModal(`<div class="modalhead"><h2>データ管理</h2><button class="close" onclick="closeModal()">×</button></div><p>作品・巻数・新刊予定・購入予定・購入履歴のデータをバックアップできます。</p><button class="primary full" onclick="exportData()">データを書き出す（JSON）</button><div style="height:10px"></div><button class="secondary full" onclick="document.getElementById('importFile').click()">バックアップから復元</button><p class="footerhint">復元すると、現在のデータはバックアップの内容に置き換わります。定期的にバックアップを保存してください。</p><div class="divider"></div><button class="danger full" onclick="resetData()">すべてのデータを削除</button>`)}
function exportData(){const blob=new Blob([JSON.stringify({...state,exportedAt:new Date().toISOString(),app:'mangaShelfApp'},null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='manga-shelf-backup-'+new Date().toISOString().slice(0,10)+'.json';a.click();URL.revokeObjectURL(a.href)}
function importData(ev){const file=ev.target.files?.[0];if(!file)return;const reader=new FileReader();reader.onload=()=>{try{const x=JSON.parse(reader.result);if(!Array.isArray(x.books)||!Array.isArray(x.plans)||!Array.isArray(x.history))throw new Error('format');if(!confirm('現在のデータを置き換えて復元しますか？'))return;state={books:x.books||[],releases:x.releases||[],plans:x.plans||[],history:x.history||[]};save();closeModal();alert('復元しました')}catch(e){alert('このファイルから復元できませんでした。漫画本棚のバックアップファイルを選んでください')}ev.target.value=''};reader.readAsText(file)}
function resetData(){if(!confirm('すべての作品・巻数・予定・履歴を削除します。この操作は元に戻せません。'))return;state={books:[],releases:[],plans:[],history:[]};save();closeModal()}
load();renderAll();
</script>
</body>
</html>
